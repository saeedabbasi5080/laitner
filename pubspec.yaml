name: recall
description: "Atilearn — A minimal, distraction-free spaced repetition flashcard app."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  get_it: ^8.0.3
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.5
  google_fonts: ^6.2.1
  uuid: ^4.5.1
  shared_preferences: ^2.5.3
  file_picker: ^10.1.2
  permission_handler: ^12.0.1
  device_info_plus: ^11.5.0
  excel: ^4.0.6
  excel2003: ^1.0.0
  flutter_tts: ^4.2.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  isar_generator: ^3.1.0+1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/atilearn_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/atilearn_logo.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/branding/atilearn_logo.png
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/branding/atilearn_logo.png
    background_color: "#FFFFFF"
    theme_color: "#0A6B6B"
